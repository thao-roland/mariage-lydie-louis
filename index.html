<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lydie, Louis & Timéa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Allura&family=Caveat:wght@500&family=Jost:wght@300;400;500&display=swap">
<style>
/* Une seule carte centrée, sceau qui se pose, texte qui s'écrit */
:root{
  --paper:#f7f0e3;
  --ink:#3f4b3d;
  --ink-soft:#6b7566;
  --sage:#86a07f;
  --butter:#f5d888;
  --blush:#f2b3bd;
  --rose:#c96a78;
  --f-script:"Allura","Brush Script MT",cursive;
  --f-hand:"Caveat","Segoe Print","Bradley Hand",cursive;
  --f-body:"Jost","Avenir Next","Segoe UI",system-ui,sans-serif;
  --k:1;
  color-scheme:light;
}
@media (max-width:600px){:root{--k:1.2}}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:calc(16px * var(--k));line-height:1.55;display:grid;place-items:center;padding-inline:24px;box-sizing:border-box;overflow:hidden;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body::before{content:"";position:fixed;inset:0;pointer-events:none;
  background:
    radial-gradient(60% 40% at 100% 0%, rgba(245,216,136,.3), transparent 70%),
    radial-gradient(50% 35% at 0% 100%, rgba(242,179,189,.28), transparent 70%),
    radial-gradient(40% 30% at 100% 100%, rgba(134,160,127,.15), transparent 70%)}
main{position:relative;z-index:2;max-width:420px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px}
.seal{width:84px;height:84px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#e98d9b,var(--rose) 60%,#a9505e);display:grid;place-items:center;
  color:#fff7f2;font-family:var(--f-script);font-size:32px;box-shadow:0 8px 18px -8px rgba(120,40,50,.6), inset 0 0 0 5px rgba(255,255,255,.18);
  animation:stamp .7s cubic-bezier(.3,1.6,.5,1) .2s both}
@keyframes stamp{from{transform:scale(2.4) rotate(-30deg);opacity:0}to{transform:rotate(-8deg);opacity:1}}
.names{font-family:var(--f-script);font-weight:400;font-size:calc(clamp(52px,15vw,68px) * var(--k) / 1.1);line-height:1;margin:6px 0 0;
  animation:ink 1.6s cubic-bezier(.6,.1,.3,1) .7s both}
@keyframes ink{from{clip-path:inset(-30% 100% -30% 0)}to{clip-path:inset(-30% -8% -30% 0)}}
.date{font-size:calc(19px * var(--k));letter-spacing:.1em;font-weight:500;display:flex;gap:12px;align-items:center}
.date i{width:5px;height:5px;border-radius:50%;background:var(--sage)}
.eyebrow{text-transform:uppercase;letter-spacing:.16em;font-size:calc(12.5px * var(--k));color:var(--ink-soft);margin:0}
.hand{font-family:var(--f-hand);font-size:calc(27px * var(--k));line-height:1.25;color:var(--sage);margin:10px 0 0;text-wrap:balance}
p{margin:0}
.up{animation:up .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.loader{display:flex;gap:10px;margin-top:8px}
.loader span{width:9px;height:9px;border-radius:50%;animation:bob 1.4s ease-in-out infinite}
.loader span:nth-child(1){background:var(--sage)}
.loader span:nth-child(2){background:var(--butter);animation-delay:.15s}
.loader span:nth-child(3){background:#f1a26a;animation-delay:.3s}
.loader span:nth-child(4){background:var(--blush);animation-delay:.45s}
@keyframes bob{0%,100%{transform:translateY(0)}40%{transform:translateY(-9px)}}
.deco{position:fixed;z-index:1;width:clamp(120px,34vw,200px);pointer-events:none}
.deco svg{display:block;width:100%;height:auto;animation:sway 7s ease-in-out infinite;transform-origin:0% 100%}
.deco.tr{top:-10px;right:-14px;scale:-1 -1}
.deco.bl{bottom:-10px;left:-14px}
@keyframes sway{0%,100%{transform:rotate(0)}50%{transform:rotate(2.5deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="leaf" viewBox="0 0 40 80"><path d="M20 78C4 60 2 30 20 2c18 28 16 58 0 76z"/><path d="M20 76V8" fill="none" stroke="rgba(255,255,255,.45)" stroke-width="1.2"/></symbol>
    <symbol id="bloom" viewBox="0 0 60 60">
      <g transform="translate(30 30)">
        <ellipse rx="10" ry="17" cy="-13"/><ellipse rx="10" ry="17" cy="-13" transform="rotate(72)"/><ellipse rx="10" ry="17" cy="-13" transform="rotate(144)"/><ellipse rx="10" ry="17" cy="-13" transform="rotate(216)"/><ellipse rx="10" ry="17" cy="-13" transform="rotate(288)"/>
        <circle r="5" fill="#f2c05a"/><circle r="2.2" fill="#c98a3a"/>
      </g>
    </symbol>
    <symbol id="corner" viewBox="0 0 200 200">
      <path d="M8 196C50 150 90 100 150 40" fill="none" stroke="#7f9a78" stroke-width="2.4" stroke-linecap="round"/>
      <use href="#leaf" fill="#8fa886" x="34" y="120" width="26" height="52" transform="rotate(-70 47 146)"/>
      <use href="#leaf" fill="#a7bb98" x="38" y="128" width="24" height="48" transform="rotate(30 50 152)"/>
      <use href="#leaf" fill="#7f9a78" x="70" y="80" width="26" height="52" transform="rotate(-60 83 106)"/>
      <use href="#leaf" fill="#9cb38f" x="76" y="92" width="24" height="48" transform="rotate(40 88 116)"/>
      <use href="#leaf" fill="#8fa886" x="108" y="42" width="24" height="48" transform="rotate(-50 120 66)"/>
      <use href="#leaf" fill="#b3c4a2" x="116" y="56" width="22" height="44" transform="rotate(50 127 78)"/>
      <use href="#leaf" fill="#7f9a78" x="140" y="16" width="20" height="40" transform="rotate(45 150 36)"/>
      <use href="#bloom" fill="#f2b3bd" x="14" y="120" width="54" height="54"/>
      <use href="#bloom" fill="#f6c99a" x="58" y="148" width="40" height="40"/>
      <use href="#bloom" fill="#f5d888" x="2" y="166" width="30" height="30"/>
    </symbol>
  </defs>
</svg>
<div class="deco tr" aria-hidden="true"><svg viewBox="0 0 200 200"><use href="#corner"/></svg></div>
<div class="deco bl" aria-hidden="true"><svg viewBox="0 0 200 200"><use href="#corner"/></svg></div>

<main>
  <div class="seal" aria-hidden="true">L&amp;L</div>
  <h1 class="names">Lydie, Louis &amp; Timéa</h1>
  <div class="date up" style="animation-delay:1.6s">5 juin 2027<i></i>Cambrils</div>
  <p class="hand up" style="animation-delay:1.9s">Votre invitation est en cours de préparation…</p>
  <p class="eyebrow up" style="animation-delay:2.1s">Revenez très bientôt</p>
  <div class="loader up" style="animation-delay:2.3s" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
</main>

</body>
</html>
